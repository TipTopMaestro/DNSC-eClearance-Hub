
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>DNSC API Integration Test</title>
</head>
<body>

    <h1>DNSC API Integration Test</h1>

    <form id="login-form">
        <label for="username">Username</label>
        <input id="username" type="text" required>

        <label for="password">Password</label>
        <input id="password" type="password" required>

        <button type="submit">Login and Test</button>
    </form>

    <pre id="result"></pre>

    <script type="module">
        import {
            apiRequest,
            setToken,
            clearToken
        } from "./assets/js/api.js";

        const form = document.getElementById("login-form");
        const result = document.getElementById("result");
        const password = document.getElementById("password");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            result.textContent = "Connecting to API...";

            try {
                const session = await apiRequest("/auth/login", {
                    method: "POST",
                    authenticated: false,
                    body: {
                        username: document.getElementById(
                            "username"
                        ).value,
                        password: password.value
                    }
                });

                setToken(session.access_token);

                const account = await apiRequest("/auth/me");

                const profile = await apiRequest("/students/me");

                result.textContent = JSON.stringify({
                    message: "Integration successful!",
                    account,
                    profile
                }, null, 2);

            } catch (error) {
                clearToken();
                result.textContent = error.message;
            } finally {
                password.value = "";
            }
        });
    </script>

</body>
</html>
